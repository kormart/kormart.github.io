<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Network Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  h1 {
    color: #e2e8f0;
    font-size: 1.5em;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  p.subtitle {
    color: #4a5568;
    font-size: 0.8em;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }
  canvas {
    border-radius: 12px;
    max-width: 100%;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.6);
  }
  footer {
    margin-top: 16px;
    color: #2d3748;
    font-size: 0.72em;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<header>
  <h1>Event Network</h1>
  <p class="subtitle">Hover a node to trace its connections &mdash; Order Processing Pipeline</p>
</header>
<canvas id="canvas"></canvas>
<footer>MERGE &nbsp;&#x25C6;&nbsp; SPLIT &nbsp;&#x25C6;&nbsp; CHAIN</footer>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── Layout ────────────────────────────────────────────────────────────────────
const COL_W  = 148;
const ROW_H  = 115;
const PAD_X  = 80;
const PAD_Y  = 70;
const COLS   = 8;   // columns 0..7
const ROWS   = 3;   // rows    0..2

const RAW_W  = PAD_X * 2 + (COLS - 1) * COL_W;
const RAW_H  = PAD_Y * 2 + (ROWS - 1) * ROW_H;

const SCALE  = Math.min(1, (window.innerWidth * 0.96) / RAW_W);
canvas.width  = Math.round(RAW_W * SCALE);
canvas.height = Math.round(RAW_H * SCALE);
ctx.scale(SCALE, SCALE);

// ── Data ─────────────────────────────────────────────────────────────────────
const nodes = [
  { id:  0, label: "Order Placed",    col: 0, row: 1,    color: "#4ade80" },
  { id:  1, label: "Payment Init",    col: 1, row: 0,    color: "#60a5fa" },
  { id:  2, label: "Inventory Check", col: 1, row: 2,    color: "#c084fc" },
  { id:  3, label: "Payment Auth",    col: 2, row: 0,    color: "#38bdf8" },
  { id:  4, label: "Fraud Check",     col: 2, row: 1,    color: "#fb923c" },
  { id:  5, label: "Reserve Stock",   col: 2, row: 2,    color: "#a78bfa" },
  { id:  6, label: "Auth Verified",   col: 3, row: 0.5,  color: "#22d3ee" },
  { id:  7, label: "Stock Reserved",  col: 3, row: 2,    color: "#818cf8" },
  { id:  8, label: "Order Confirmed", col: 4, row: 1.25, color: "#f472b6" },
  { id:  9, label: "Fulfillment",     col: 5, row: 0.5,  color: "#fb923c" },
  { id: 10, label: "Notification",    col: 5, row: 2,    color: "#94a3b8" },
  { id: 11, label: "Shipped",         col: 6, row: 0,    color: "#f97316" },
  { id: 12, label: "Tracking",        col: 6, row: 1,    color: "#fbbf24" },
  { id: 13, label: "Delivered",       col: 7, row: 0.5,  color: "#4ade80" },
];

const edges = [
  { from:  0, to:  1 },   // Order → Payment Init          (split)
  { from:  0, to:  2 },   // Order → Inventory Check       (split)
  { from:  1, to:  3 },   // Payment Init → Payment Auth
  { from:  1, to:  4 },   // Payment Init → Fraud Check    (split)
  { from:  2, to:  5 },   // Inventory → Reserve Stock
  { from:  3, to:  6 },   // Payment Auth → Auth Verified  (merge in)
  { from:  4, to:  6 },   // Fraud Check → Auth Verified   (merge in)
  { from:  4, to:  8 },   // Fraud Check → Order Confirmed (also feeds directly)
  { from:  5, to:  7 },   // Reserve → Stock Reserved
  { from:  6, to:  8 },   // Auth Verified → Order Confirmed (merge in)
  { from:  7, to:  8 },   // Stock Reserved → Order Confirmed (merge in)
  { from:  8, to:  9 },   // Order Confirmed → Fulfillment (split)
  { from:  8, to: 10 },   // Order Confirmed → Notification (split)
  { from:  9, to: 11 },   // Fulfillment → Shipped         (split)
  { from:  9, to: 12 },   // Fulfillment → Tracking        (split)
  { from: 10, to: 12 },   // Notification → Tracking       (merge in)
  { from: 11, to: 13 },   // Shipped → Delivered           (merge in)
  { from: 12, to: 13 },   // Tracking → Delivered          (merge in)
];

// ── Lookup helpers ────────────────────────────────────────────────────────────
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

function pos(node) {
  return {
    x: PAD_X + node.col * COL_W,
    y: PAD_Y + node.row * ROW_H,
  };
}

// ── Bezier helpers ────────────────────────────────────────────────────────────
function controlPoints(from, to) {
  const fp = pos(from), tp = pos(to);
  const dx = tp.x - fp.x;
  return {
    fp, tp,
    cp1: { x: fp.x + dx * 0.5, y: fp.y },
    cp2: { x: tp.x - dx * 0.5, y: tp.y },
  };
}

function bezierAt(fp, cp1, cp2, tp, t) {
  const m = 1 - t;
  return {
    x: m*m*m*fp.x + 3*m*m*t*cp1.x + 3*m*t*t*cp2.x + t*t*t*tp.x,
    y: m*m*m*fp.y + 3*m*m*t*cp1.y + 3*m*t*t*cp2.y + t*t*t*tp.y,
  };
}

// ── Rounded rect path ─────────────────────────────────────────────────────────
function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x,     y + h, x,     y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x,     y,     x + r, y);
  ctx.closePath();
}

// ── Arrowhead ────────────────────────────────────────────────────────────────
function drawArrow(x, y, angle, color) {
  const s = 7;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-s, -s * 0.45);
  ctx.lineTo(-s,  s * 0.45);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ── Particles ────────────────────────────────────────────────────────────────
const particles = [];
edges.forEach((edge, ei) => {
  const count = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < count; i++) {
    particles.push({
      edgeIdx: ei,
      t:     Math.random(),
      speed: 0.0028 + Math.random() * 0.0022,
      color: nodeMap[edge.from].color,
    });
  }
});

// ── Hover state ───────────────────────────────────────────────────────────────
let hoveredNode = null;

function edgeIsHighlighted(edge) {
  if (!hoveredNode) return true;
  return edge.from === hoveredNode.id || edge.to === hoveredNode.id;
}

function nodeIsHighlighted(nodeId) {
  if (!hoveredNode) return true;
  if (nodeId === hoveredNode.id) return true;
  return edges.some(e =>
    (e.from === hoveredNode.id && e.to === nodeId) ||
    (e.to === hoveredNode.id && e.from === nodeId)
  );
}

// ── Draw functions ────────────────────────────────────────────────────────────
function drawEdge(edge) {
  const from = nodeMap[edge.from];
  const to   = nodeMap[edge.to];
  const hi   = edgeIsHighlighted(edge);
  const { fp, tp, cp1, cp2 } = controlPoints(from, to);

  const grad = ctx.createLinearGradient(fp.x, fp.y, tp.x, tp.y);
  grad.addColorStop(0, from.color);
  grad.addColorStop(1, to.color);

  ctx.save();
  ctx.globalAlpha = hi ? (hoveredNode ? 0.85 : 0.45) : 0.08;
  ctx.strokeStyle = grad;
  ctx.lineWidth   = hi && hoveredNode ? 2.2 : 1.6;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(fp.x, fp.y);
  ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, tp.x, tp.y);
  ctx.stroke();

  // Arrow near destination
  const pa = bezierAt(fp, cp1, cp2, tp, 0.91);
  const pb = bezierAt(fp, cp1, cp2, tp, 0.99);
  const angle = Math.atan2(pb.y - pa.y, pb.x - pa.x);
  ctx.globalAlpha = hi ? (hoveredNode ? 1 : 0.5) : 0.08;
  drawArrow(tp.x, tp.y, angle, to.color);
  ctx.restore();
}

function drawParticle(p) {
  const edge = edges[p.edgeIdx];
  const from = nodeMap[edge.from];
  const to   = nodeMap[edge.to];
  const hi   = edgeIsHighlighted(edge);
  const { fp, tp, cp1, cp2 } = controlPoints(from, to);
  const pt = bezierAt(fp, cp1, cp2, tp, p.t);

  ctx.save();
  ctx.globalAlpha = hi ? 0.9 : 0.05;
  ctx.shadowColor = p.color;
  ctx.shadowBlur  = 10;
  ctx.fillStyle   = p.color;
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, hi && hoveredNode ? 3.5 : 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawNode(node) {
  const { x, y } = pos(node);
  const nw = 106, nh = 34, r = 8;
  const isHov = hoveredNode && hoveredNode.id === node.id;
  const hi    = nodeIsHighlighted(node.id);

  ctx.save();
  ctx.globalAlpha = hi ? 1 : 0.2;

  if (isHov) {
    ctx.shadowColor = node.color;
    ctx.shadowBlur  = 22;
  }

  // Card fill
  ctx.fillStyle = '#111827';
  rrPath(x - nw/2, y - nh/2, nw, nh, r);
  ctx.fill();

  // Border
  ctx.strokeStyle = node.color;
  ctx.lineWidth   = isHov ? 2 : 1.5;
  rrPath(x - nw/2, y - nh/2, nw, nh, r);
  ctx.stroke();

  // Inner highlight stripe (top edge glow)
  if (isHov) {
    const shine = ctx.createLinearGradient(x - nw/2, y - nh/2, x + nw/2, y - nh/2);
    shine.addColorStop(0,   'rgba(255,255,255,0)');
    shine.addColorStop(0.5, 'rgba(255,255,255,0.08)');
    shine.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    rrPath(x - nw/2, y - nh/2, nw, nh, r);
    ctx.fill();
  }

  // Label
  ctx.shadowBlur     = 0;
  ctx.fillStyle      = isHov ? '#fff' : '#cbd5e1';
  ctx.font           = `${isHov ? 600 : 400} 10.5px system-ui`;
  ctx.textAlign      = 'center';
  ctx.textBaseline   = 'middle';
  ctx.fillText(node.label, x, y);

  ctx.restore();
}

// ── Merge / split indicators ──────────────────────────────────────────────────
// Find nodes with multiple incoming or multiple outgoing edges
const inDeg  = {};
const outDeg = {};
nodes.forEach(n => { inDeg[n.id] = 0; outDeg[n.id] = 0; });
edges.forEach(e => { outDeg[e.from]++; inDeg[e.to]++; });

function drawBadge(node) {
  const isMerge = inDeg[node.id]  > 1;
  const isSplit = outDeg[node.id] > 1;
  if (!isMerge && !isSplit) return;

  const { x, y } = pos(node);
  const nw = 106, nh = 34;
  const hi = nodeIsHighlighted(node.id);

  ctx.save();
  ctx.globalAlpha = hi ? 1 : 0.2;

  if (isMerge && isSplit) {
    drawBadgePill(x - nw/2 - 30, y, '⟦M/S⟧', '#f472b6');
  } else if (isMerge) {
    drawBadgePill(x - nw/2 - 26, y, '⟦M⟧', '#22d3ee');
  } else {
    drawBadgePill(x + nw/2 + 26, y, '⟦S⟧', '#fb923c');
  }

  ctx.restore();
}

function drawBadgePill(cx, cy, label, color) {
  ctx.font          = 'bold 8.5px system-ui';
  ctx.textAlign     = 'center';
  ctx.textBaseline  = 'middle';
  ctx.fillStyle     = color + '22';
  const tw = ctx.measureText(label).width + 8;
  rrPath(cx - tw/2, cy - 8, tw, 16, 4);
  ctx.fill();
  ctx.strokeStyle   = color + '66';
  ctx.lineWidth     = 0.8;
  rrPath(cx - tw/2, cy - 8, tw, 16, 4);
  ctx.stroke();
  ctx.fillStyle     = color;
  ctx.fillText(label, cx, cy);
}

// ── Grid lines (subtle) ───────────────────────────────────────────────────────
function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([4, 8]);
  for (let c = 0; c < COLS; c++) {
    const x = PAD_X + c * COL_W;
    ctx.beginPath();
    ctx.moveTo(x, 20);
    ctx.lineTo(x, RAW_H - 20);
    ctx.stroke();
  }
  ctx.restore();
}

// ── Main render loop ─────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, RAW_W, RAW_H);

  // Background gradient
  const bg = ctx.createRadialGradient(RAW_W/2, RAW_H/2, 0, RAW_W/2, RAW_H/2, RAW_W * 0.7);
  bg.addColorStop(0, '#0f1d2e');
  bg.addColorStop(1, '#070d15');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, RAW_W, RAW_H);

  drawGrid();
  edges.forEach(drawEdge);
  particles.forEach(drawParticle);
  nodes.forEach(drawNode);
  nodes.forEach(drawBadge);
}

function update() {
  particles.forEach(p => {
    p.t += p.speed;
    if (p.t > 1) p.t -= 1;
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ── Mouse interaction ────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / SCALE;
  const my = (e.clientY - rect.top)  / SCALE;

  let found = null;
  for (const node of nodes) {
    const { x, y } = pos(node);
    if (Math.abs(mx - x) < 56 && Math.abs(my - y) < 20) {
      found = node;
      break;
    }
  }
  hoveredNode = found;
  canvas.style.cursor = found ? 'pointer' : 'default';
});

canvas.addEventListener('mouseleave', () => { hoveredNode = null; });

loop();
</script>
</body>
</html>
